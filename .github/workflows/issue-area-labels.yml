name: Issue area labels

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label-area:
    name: Apply area badge
    runs-on: ubuntu-latest
    steps:
      - name: Set the area label from the form
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const match = body.match(/^### Area\r?\n\r?\n(.+)$/m);
            const areaLabels = {
              "Audio": "audio",
              "Interface": "interface",
              "Documentation": "documentation",
              "Build and CI": "build",
              "Security": "security",
            };
            const selected = match ? areaLabels[match[1].trim()] : undefined;
            const managed = Object.values(areaLabels);
            const current = (context.payload.issue.labels || []).map((label) => label.name);

            for (const name of managed) {
              if (name !== selected && current.includes(name)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  name,
                });
              }
            }

            if (selected && !current.includes(selected)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: [selected],
              });
            }

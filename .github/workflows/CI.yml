name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [Main, Dev, CICD]
    tags: ["v*"]
  pull_request:
    branches: [Main, Dev, CICD]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_DIR: build

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find Source Tests \
            \( -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

  tests:
    name: Tests (${{ matrix.name }})
    needs: format
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
          - name: linux-x64
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JUCE dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            mesa-common-dev \
            libjack-jackd2-dev \
            libdbus-1-dev

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: install.bat test

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x ./install.sh
          ./install.sh test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: ignore
          path: build/Testing/

  coverage:
    name: Coverage
    needs: format
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests with coverage
        shell: cmd
        run: install.bat test --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          retention-days: 14
          if-no-files-found: error
          path: |
            build/coverage/coverage.xml
            build/coverage/html/

  build:
    name: Build (${{ matrix.name }})
    needs: format
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
          - name: windows-arm64
            runner: windows-11-arm
          - name: linux-x64
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JUCE dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            mesa-common-dev \
            libjack-jackd2-dev \
            libdbus-1-dev

      - name: Build project (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: install.bat build

      - name: Build project (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x ./install.sh
          ./install.sh build

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/bin/lib/VST3/**
            build/bin/Standalone/**

  release:
    name: Release
    needs: [tests, coverage, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts/

      - name: Create release archives
        run: |
          for dir in artifacts/build-*/; do
            target=$(basename "$dir" | sed 's/^build-//')
            if [[ "$target" == windows-* ]]; then
              (cd artifacts && zip -r "../${target}.zip" "build-${target}")
            else
              tar -czf "${target}.tar.gz" -C artifacts "build-${target}"
            fi
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.zip
            *.tar.gz

name: CI/CD VST3 Builds (JUCE - Projucer)

on:
  push:
    branches: [ Main, Dev ]
  pull_request:
    branches: [ Main, Dev ]

jobs:
  code_style_check:
    runs-on: ubuntu-latest
    steps:
    - name: ⬇️ Checkout Code
      uses: actions/checkout@v4

    - name: 🔨 Install Clang-Format
      run: sudo apt-get install -y clang-format

    - name: 🔎 Run Clang-Format Check
      run: |
        find Source/ -type f \( -name "*.cpp" -o -name "*.h" \) | xargs clang-format --Werror --dry-run --ferror-limit=1 -style=file

  build_windows:
    runs-on: windows-latest
    needs: code_style_check
    steps:
    - name: ⬇️ Checkout Code
      uses: actions/checkout@v4

    - name: 📥 Download Projucer (Windows)
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://github.com/juce-framework/JUCE/releases/download/8.0.10/juce-8.0.10-windows.zip -OutFile juce.zip
        Expand-Archive juce.zip -DestinationPath .

    - name: 🔄 Regenerate Project with Projucer
      run: JUCE/Projucer.exe --resave Profiler.jucer

    - name: ⚙️ Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: 🔨 Build VST3 (Windows)
      run: |
        msbuild "Builds\VisualStudio2022\Profiler.sln" /p:Configuration=Release /p:Platform=x64 /p:PreferredToolArchitecture=x64

    - name: 📦 Upload Artifact (Windows)
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: Profiler-VST3-Windows
        path: Builds/VisualStudio2022/x64/Release/VST3/Profiler.vst3

  build_linux:
    runs-on: ubuntu-latest
    needs: code_style_check
    steps:
    - name: ⬇️ Checkout Code
      uses: actions/checkout@v4

    - name: 📦 Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libcurl4-openssl-dev libasound2-dev libjack-jackd2-dev libfreetype6-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev

    - name: 📥 Download Projucer (Linux)
      run: |
        curl -L https://github.com/juce-framework/JUCE/releases/download/8.0.10/juce-8.0.10-linux.zip -o juce.zip
        unzip juce.zip
        chmod +x JUCE/Projucer

    - name: 🔄 Regenerate Project with Projucer
      run: ./JUCE/Projucer --resave Profiler.jucer

    - name: 🔨 Build VST3 (Linux)
      run: |
        cd Builds/Linux
        make -j$(nproc) CONFIG=Release

    - name: 📦 Upload Artifact (Linux)
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: Profiler-VST3-Linux
        path: Builds/Linux/build/VST3/Release/Profiler.vst3

  build_macos:
    runs-on: macos-latest
    needs: code_style_check
    steps:
    - name: ⬇️ Checkout Code
      uses: actions/checkout@v4

    - name: 📥 Download Projucer (macOS)
      run: |
        curl -L https://github.com/juce-framework/JUCE/releases/download/8.0.10/juce-8.0.10-osx.zip -o juce.zip
        unzip juce.zip
        chmod +x JUCE/Projucer.app/Contents/MacOS/Projucer

    - name: 🔄 Regenerate Project with Projucer
      run: JUCE/Projucer.app/Contents/MacOS/Projucer --resave Profiler.jucer

    - name: 🔨 Build VST3 (macOS - Universal)
      run: |
        cd Builds/MacOSX
        xcodebuild -project Profiler.xcodeproj -configuration Release -arch arm64 -arch x86_64

    - name: 📦 Upload Artifact (macOS)
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: Profiler-VST3-macOS
        path: Builds/MacOSX/build/Release/Profiler.vst3
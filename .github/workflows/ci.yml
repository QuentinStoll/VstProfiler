name: CI/CD Profiler - Multiplatform VST3 Build

on:
  push:
    branches: [ Dev, Main ]
  pull_request:
    branches: [ Dev, Main ]

jobs:
  code_style_check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Clang-Format
      run: sudo apt-get install -y clang-format

    - name: Run Clang-Format Check
      run: |
        find Source/ -type f \( -name "*.cpp" -o -name "*.h" \) | xargs clang-format --Werror --dry-run --ferror-limit=1 -style=file

  build_windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Download JUCE
      shell: pwsh
      run: |
        Write-Host "Downloading JUCE 8.0.12..."
        Invoke-WebRequest -Uri 'https://github.com/juce-framework/JUCE/releases/download/8.0.12/juce-8.0.12-windows.zip' -OutFile 'juce.zip'
        New-Item -ItemType Directory -Force -Path "Libs\JUCE" | Out-Null
        Expand-Archive -Force 'juce.zip' -DestinationPath "Libs"
        Remove-Item 'juce.zip'

    - name: Build Projucer (Windows)
      run: msbuild "Libs\JUCE\extras\Projucer\Builds\VisualStudio2022\Projucer.sln" /p:Configuration=Release /p:Platform=x64 /m

    - name: Regenerate Project with Projucer
      shell: pwsh
      run: |
        & "Libs\JUCE\extras\Projucer\Builds\VisualStudio2022\x64\Release\App\Projucer.exe" --resave Profiler.jucer

    - name: Build VST3 (Windows)
      run: msbuild "Builds\VisualStudio2022\Profiler.sln" /p:Configuration=Release /p:Platform=x64 /p:PreferredToolArchitecture=x64 /m

    - name: Upload Artifact (Windows)
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: Profiler-VST3-Windows
        path: Builds/VisualStudio2022/x64/Release/VST3/Profiler.vst3
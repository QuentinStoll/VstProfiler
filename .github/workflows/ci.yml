name: CI/CD Profiler - Multiplatform VST3 Build

on:
  push:
    branches: [ Dev, Main ]
  pull_request:
    branches: [ Dev, Main ]

jobs:
  code_style_check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Clang-Format
      run: sudo apt-get install -y clang-format

    - name: Run Clang-Format Check
      run: |
        find Source/ -type f \( -name "*.cpp" -o -name "*.h" \) | xargs clang-format --Werror --dry-run --ferror-limit=1 -style=file

  build_windows:
    runs-on: windows-latest
    # needs: code_style_check
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download JUCE
      shell: pwsh
      run: |
        Write-Host "Downloading JUCE 8.0.12..."
        Invoke-WebRequest -Uri 'https://github.com/juce-framework/JUCE/releases/download/8.0.12/juce-8.0.12-windows.zip' -OutFile 'juce.zip'
        New-Item -ItemType Directory -Force -Path "Libs\JUCE" | Out-Null
        Expand-Archive -Force 'juce.zip' -DestinationPath "Libs\JUCE"
        Remove-Item 'juce.zip'
        Write-Host "JUCE ready in Libs\JUCE"

    - name: Build Projucer (Windows)
      run: msbuild "Libs\JUCE\extras\Projucer\Builds\VisualStudio2022\Projucer.sln" /p:Configuration=Release /p:Platform=x64

    - name: Regenerate Project with Projucer
      shell: pwsh
      run: |
        & "Libs\JUCE\extras\Projucer\Builds\VisualStudio2022\x64\Release\App\Projucer.exe" --resave Profiler.jucer

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build VST3 (Windows)
      run: msbuild "Builds\VisualStudio2022\Profiler.sln" /p:Configuration=Release /p:Platform=x64 /p:PreferredToolArchitecture=x64

    - name: Upload Artifact (Windows)
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: Profiler-VST3-Windows
        path: Builds/VisualStudio2022/x64/Release/VST3/Profiler.vst3

  build_linux:
    runs-on: ubuntu-latest
    # needs: code_style_check
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          g++ \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libcurl4-openssl-dev \
          libasound2-dev \
          libjack-jackd2-dev \
          libfreetype6-dev \
          libx11-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxcursor-dev

    - name: Download JUCE
      run: |
        echo "Downloading JUCE 8.0.12..."
        curl -L https://github.com/juce-framework/JUCE/releases/download/8.0.12/juce-8.0.12-linux.zip -o juce.zip
        mkdir -p Libs/JUCE
        unzip -o juce.zip -d Libs/JUCE
        rm juce.zip
        echo "JUCE ready in Libs/JUCE"

    - name: Build Projucer (Linux)
      run: |
        cd Libs/JUCE/extras/Projucer/Builds/LinuxMakefile
        make -j$(nproc) CONFIG=Release

    - name: Regenerate Project with Projucer
      run: Libs/JUCE/extras/Projucer/Builds/LinuxMakefile/build/Projucer --resave Profiler.jucer

    - name: Build VST3 (Linux)
      run: |
        cd Builds/Linux
        make -j$(nproc) CONFIG=Release

    - name: Upload Artifact (Linux)
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: Profiler-VST3-Linux
        path: Builds/Linux/build/VST3/Release/Profiler.vst3

  build_macos:
    runs-on: macos-latest
    # needs: code_style_check
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download JUCE
      run: |
        echo "Downloading JUCE 8.0.12..."
        curl -L https://github.com/juce-framework/JUCE/releases/download/8.0.12/juce-8.0.12-osx.zip -o juce.zip
        mkdir -p Libs/JUCE
        unzip -o juce.zip -d Libs/JUCE
        rm juce.zip
        echo "JUCE ready in Libs/JUCE"

    - name: Build Projucer (macOS)
      run: |
        cd Libs/JUCE/extras/Projucer/Builds/MacOS
        xcodebuild -project Projucer.xcodeproj -configuration Release -quiet

    - name: Regenerate Project with Projucer
      run: Libs/JUCE/extras/Projucer/Builds/MacOS/build/Release/Projucer --resave Profiler.jucer

    - name: Build VST3 (macOS - Universal)
      run: |
        cd Builds/MacOSX
        xcodebuild -project Profiler.xcodeproj -configuration Release -arch arm64 -arch x86_64 -quiet

    - name: Upload Artifact (macOS)
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: Profiler-VST3-macOS
        path: Builds/MacOSX/build/Release/Profiler.vst3
name: "Branch Naming Rules"

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          BASE_BRANCH="${{ github.base_ref }}"
          REGEX="^(feature|fix|docs|chore|feat|poc)/[a-z0-9._-]+$"

          if [[ "$BASE_BRANCH" != "main" && "$BASE_BRANCH" != "Main" ]]; then
            echo "❌ Error: Pull requests must target main. Base was '$BASE_BRANCH'."
            exit 1
          fi

          if [[ ! $BRANCH_NAME =~ $REGEX ]]; then
            echo "❌ Error: Invalid branch name '$BRANCH_NAME'."
            echo "Use feature/, fix/, docs/, or chore/, then a short lowercase description."
            echo "Examples: feature/profile-export, fix/amp-loading"
            exit 1
          fi
          echo "✅ Branch name is valid."
